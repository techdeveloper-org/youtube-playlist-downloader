[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-playlist-downloader"
version = "1.0.0"
description = "A smart YouTube playlist and video downloader for Windows with IDM & Python multi-connection support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "speedtest-cli>=2.1.3",
    "customtkinter>=5.2.0",
]

[project.scripts]
youtube-downloader = "youtube_playlist_downloader.main:main"
youtube-downloader-gui = "youtube_playlist_downloader.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["youtube_playlist_downloader*"]
