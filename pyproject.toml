[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-playlist-downloader"
version = "2.0.0"
description = "A robust, parallel YouTube playlist downloader with a modern GUI, smart IDM integration, 8-part native downloading, and bulletproof yt-dlp 403-bypass core."\nkeywords = ["youtube-downloader", "yt-dlp", "idm-integration", "customtkinter", "parallel-processing", "youtube-playlist", "download-manager", "anti-bot", "gui"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "speedtest-cli>=2.1.3",
    "customtkinter>=5.2.0",
]

[project.scripts]
youtube-downloader = "main:main"
youtube-downloader-gui = "gui:main"

[tool.setuptools]
py-modules = [
    "choices",
    "deps",
    "downloaders",
    "extractor",
    "files_io",
    "formats",
    "gui",
    "main",
    "paths",
    "speedtest_utils",
    "utils",
    "workflow",
]
packages = ["youtube_playlist_downloader"]
